# Sirve la SPA y reenvía la API y los WebSockets al backend.
# "backend" es el nombre del servicio en docker-compose.yml.

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # DNS interno de Docker: si el backend se reinicia y cambia de IP, nginx lo vuelve a encontrar.
  resolver 127.0.0.11 valid=10s;
  set $backend http://backend:4000;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ {
    proxy_pass $backend;
    # $http_host conserva el puerto (localhost:8080): con él se arman las URL de regreso de las pasarelas.
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Socket.IO: carrito colaborativo, mapa de sala y cocina en tiempo real.
  location /socket.io/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # Archivos con hash en el nombre: se pueden cachear para siempre.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Cualquier otra ruta (/mesa/12, /sala, /admin…) la resuelve React Router.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
